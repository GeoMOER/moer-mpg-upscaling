# Default settings
defaults:
  # unit00
  - scope:
      path: ""
      type: unit00
    values:
      category: "How-to Upscaling"
      tags: "Unit 00"
      layout: single
      sidebar:
        nav: "course_unit"
  # unit01
  - scope:
      path: ""
      type: unit01
    values:
      category: "01 Getting started"
      tags: "Unit 01"
      layout: single
      sidebar:
        nav: "course_unit" 
  # unit02
  - scope:
      path: ""
      type: unit02
    values:
      category: "02 Kilimanjaro SES"
      tags: "Unit 02"
      layout: single
      sidebar:
        nav: "course_unit" 
  # unit03
  - scope:
      path: ""
      type: unit03
    values:
      category: "03 Remote Sensing basics"
      tags: "Unit 03"
      layout: single
      sidebar:
        nav: "course_unit" 
  # unit04
  - scope:
      path: ""
      type: unit04
    values:
      category: "04 LiDAR Remote Sensing"
      tags: "Unit 04"
      layout: single
      sidebar:
        nav: "course_unit" 
  # unit05
  - scope:
      path: ""
      type: unit05
    values:
      category: "05 Hyperspectral Remote Sensing"
      tags: "Unit 05"
      layout: single
      sidebar:
        nav: "course_unit" 
    # unit06
  - scope:
      path: ""
      type: unit06
    values:
      category: "06 Foundation models and satellite embeddings"
      tags: "Unit 06"
      layout: single
      sidebar:
        nav: "course_unit"
  # unit07
  - scope:
      path: ""
      type: unit07
    values:
      category: "07 Set up your research project"
      tags: "Unit 07"
      layout: single
      sidebar:
        nav: "course_unit"
  # unit08
  - scope:
      path: ""
      type: unit08
    values:
      category: "08 Upscaling workflow"
      tags: "Unit 08"
      layout: single
      sidebar:
        nav: "course_unit"
  # pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      sidebar:
        nav: "docs"         

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-admin
  - jekyll-paginate
  - jekyll-gist
  - jemoji
  - jekyll-include-cache
  - jekyll-algolia

